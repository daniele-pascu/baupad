# Supabase-Funktion „storage“ automatisch veröffentlichen – sobald sich ihr Code auf main ändert (oder per Hand
# unter Actions → „Run workflow“). Ersetzt das Kopieren des Codes im Supabase-Dashboard.
# Braucht das Repository-Secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens, „Full access“).
# „Verify JWT“ bleibt aus (--no-verify-jwt): die Funktion prüft die Anmeldung selbst, sonst blockt Supabase
# schon die Voranfrage des Browsers.
name: Supabase-Funktion storage veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/storage/**'
      - '.github/workflows/supabase-storage.yml'
  workflow_dispatch:

concurrency:
  group: supabase-storage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: knaskwuhjixxpnqjfqpx
    steps:
      - name: Schlüssel vorhanden?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Funktion veröffentlichen
        run: supabase functions deploy storage --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Funktion erreichbar?
        # ohne Anmeldung antwortet die Funktion mit 401 – Hauptsache, sie läuft (nicht 404/5xx)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/functions/v1/storage" -H 'content-type: application/json' -d '{}')
          echo "Antwort: $code"
          if [ "$code" = "404" ] || [ "$code" -ge 500 ]; then exit 1; fi
